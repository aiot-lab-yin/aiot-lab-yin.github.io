# ===============================
# 🔬 AIoT Laboratory Configuration
# ===============================

# Laboratory Information
lab_name: "AIoT Laboratory"
lab_short_name: "AIoT Lab"
university: "Reitaku University"
university_url: "https://www.reitaku-u.ac.jp/"
department: "Faculty of Engineering"
pi_name: "Dr. Yin Chen"
pi_email: "ychen@reitaku-u.ac.jp"

# Site Settings
title: "AIoT Laboratory - Reitaku University"
name: "AIoT Laboratory"
description: "Artificial Intelligence of Things Laboratory at Reitaku University"
lang: "en"
timezone: "Asia/Tokyo"
baseurl: ""
url: "https://www.aiotlabs.org"

# Navigation Bar
navbar-title: "🧠 AIoT Lab"
navbar-links:
  Home: "/"
  About: "/aboutme"
  Members: "/members"
  Research Group(kg): "/kg/"
  Research: "/projects"
  Publications: "/publications"
  Tutorials: "/tutorials/"
  News: "/blog"
  Contact: "#contact"

# Social Links
social-network-links:
  # email: "ychen@reitaku-u.ac.jp"
  github: "aiot-lab-yin"
  researchmap: "yinchen"
  # orcid: "0000-0003-XXXX-XXXX"
  # google-scholar: "citations?user=XXXXX"
  # Optional:
  # twitter: "aiot_lab"
  # linkedin: "company/aiot-lab"
  # youtube: "channel/your_channel"

# Theme Configuration
markdown: kramdown
# kramdown:
#   input: GFM
#   hard_wrap: false
#   parse_block_html: true
highlighter: rouge
permalink: /:categories/:title/

# Comments (optional)
comments:
  disqus: false
  facebook: false
  staticman: false
  
# Sharing Buttons
share-links-active:
  twitter: true
  facebook: true
  linkedin: true
  vk: false
  reddit: false

# Local site search (no third-party search service).
post_search: true

# Custom CSS
site-css:
  - "/assets/css/custom.css"

# Visual Elements
favicon: "/assets/img/lab-logo.svg"
logo: "/assets/img/lab-logo.svg"

# Posts share the same layout unless explicitly overridden.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      social-share: true

# Keep templates, development files, and build tools out of the published site.
exclude:
  - README.md
  - CHANGELOG.md
  - LICENSE
  - Appraisals
  - beautiful-jekyll-theme.gemspec
  - staticman.yml
  - projects/example-project.md
  - scripts
  - vendor
  - Gemfile
  - Gemfile.lock

site-js:
  - "/assets/js/search.js"
rss-description: "News and research updates from AIoT Laboratory at Reitaku University."
